<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSE-160 — Virtual World</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        background: #1a1f26;
        color: #e8edf5;
      }
      #wrap {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #hud {
        position: absolute;
        left: 16px;
        top: 16px;
        max-width: min(420px, 92vw);
        padding: 12px 14px;
        background: rgba(15, 18, 24, 0.78);
        border-radius: 10px;
        line-height: 1.45;
        font-size: 14px;
        pointer-events: none;
      }
      #hud h1 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #hud kbd {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 12px;
      }
      #hud-win {
        display: none;
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        background: rgba(80, 200, 120, 0.25);
        border: 1px solid rgba(120, 240, 160, 0.45);
      }
      #hud-meta {
        margin-top: 8px;
        font-size: 12px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="canvas" width="960" height="540"></canvas>
      <div id="hud">
        <h1>Shepherd of the Hollow — collect all crystals</h1>
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Q</kbd><kbd>E</kbd> turn · mouse look (click to lock)</div>
        <div><kbd>F</kbd> place block · <kbd>G</kbd> remove · mouse <strong>LMB</strong> / <strong>RMB</strong> when locked</div>
        <div id="hud-crystals">0 / 8 crystals</div>
        <div id="hud-win">The flock is safe — you gathered every crystal.</div>
        <div id="hud-meta"><span id="hud-fps">— fps</span></div>
      </div>
    </div>
    <script src="lib/cuon-matrix.js"></script>
    <script src="camera.js"></script>
    <script src="main.js"></script>
  </body>
</html>
